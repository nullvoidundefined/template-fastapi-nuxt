# Runs the API, the worker, and the web server with Postgres 17 and Redis 7 (spec B-3, R-351).
# `docker compose up --build --wait` returns once every container's HEALTHCHECK passes. This file
# is for local development and CI only: Postgres accepts passwordless connections on the compose
# network, so no credential appears here or in any env file (R-103, R-108). Deployed environments
# set DATABASE_URL and REDIS_URL from the platform's secrets. Postgres and Redis publish on host
# ports 5433 and 6380 by default, so a locally installed Postgres or Redis on the standard ports
# does not shadow them, and only on loopback, because the compose Postgres is passwordless and Redis
# has no auth; override the ports with POSTGRES_HOST_PORT and REDIS_HOST_PORT. The app services
# restart on exit, as the platform restarts them: arq exits when it loses Redis and comes back
# healthy once Redis does.
name: template-fastapi-nuxt

x-server-environment: &server-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app', '-d', 'app']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Stripe's official mock of its API, started only with `docker compose --profile e2e up`, so the
  # end-to-end suite exercises checkout and the portal without a Stripe account or the network.
  # It accepts any test key and answers from Stripe's OpenAPI fixtures. Published on loopback only.
  # Pinned to a release, so a new stripe-mock cannot change the end-to-end run's answers unannounced.
  stripe-mock:
    image: stripe/stripe-mock:v0.203.0
    profiles: ['e2e']
    ports:
      - '127.0.0.1:${STRIPE_MOCK_HOST_PORT:-12111}:12111'

  # One-shot: brings the schema to head and exits, so no process ever serves traffic against an
  # unmigrated database. It runs the API image rather than a checkout, which is what proves the
  # image really carries `alembic.ini` and `migrations/`; a missing COPY fails compose rather than
  # the first deploy. `restart: no` because a completed migration must stay completed for the
  # `service_completed_successfully` conditions below.
  migrate:
    restart: 'no'
    image: template-fastapi-nuxt-api
    build:
      context: apps/server
      dockerfile: Dockerfile
    command: ['alembic', 'upgrade', 'head']
    environment:
      <<: *server-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    # Named explicitly, which is the name compose would derive anyway, so CI can build this
    # image with a layer cache and then start the stack with `up --no-build`.
    image: template-fastapi-nuxt-api
    build:
      context: apps/server
      dockerfile: Dockerfile
    environment:
      <<: *server-environment
      PORT: '3001'
      # Uvicorn honors X-Forwarded-For only from this address, so the rate limiter keys a
      # proxied request on the client the web service resolved rather than on a header the
      # client controls. It names the one static address below, not Docker's private range:
      # trusting the whole range would trust every container on it, and uvicorn's allowlist
      # takes addresses and CIDRs, never a service name, which is why the network is fixed.
      FORWARDED_ALLOW_IPS: 172.28.0.10
      # Billing stays unconfigured unless the host exports these, and an empty value reads as
      # unset. The end-to-end run exports STRIPE_API_BASE=http://stripe-mock:12111 with a test
      # key and signing secret, and starts the `e2e` profile so stripe-mock is there to answer.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-}
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    # Named explicitly, which is the name compose would derive anyway, so CI can build this
    # image with a layer cache and then start the stack with `up --no-build`.
    image: template-fastapi-nuxt-worker
    build:
      context: apps/server
      dockerfile: Dockerfile.worker
    environment:
      <<: *server-environment
      WORKER_PORT: '3002'
    # The image's HEALTHCHECK is liveness (/health), so a dependency outage never restarts a
    # working process; compose waits on readiness instead, so `up --wait` proves Postgres and Redis.
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    restart: unless-stopped
    # Named explicitly, which is the name compose would derive anyway, so CI can build this
    # image with a layer cache and then start the stack with `up --no-build`.
    image: template-fastapi-nuxt-web
    build:
      context: .
      dockerfile: apps/client/web/Dockerfile
    environment:
      NUXT_API_BASE_URL: http://api:3001
    ports:
      - '3000:3000'
    # Fixed, because FORWARDED_ALLOW_IPS on the API must name it. Compose allocates container
    # addresses dynamically on the default network, so without this the only options are an
    # address guessed in advance, which silently breaks client-IP resolution when it changes,
    # and trusting the whole private range, which is what this replaces.
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
