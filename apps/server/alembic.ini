; Alembic configuration for the API's migration chain.
;
; `sqlalchemy.url` is deliberately empty: the URL is a secret and never lives in a checked-in file
; (R-102). `migrations/env.py` reads it from the application's own Settings, so `alembic` and the
; running service always agree on which database they are pointed at, and a caller that needs a
; different one (the integration fixture, a one-off against a branch) sets the option in memory.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

; No logging sections on purpose: `env.py` never calls `fileConfig`, and installs one stdout
; handler itself only when the process has none, so a standalone `alembic upgrade head` still
; prints its progress and a migration run inside a configured process emits the same JSON lines
; as the service. See `configure_migration_logging` in `migrations/env.py`.
