components:
  schemas:
    AdminUserData:
      description: 'One user as an administrator sees it: never the password hash.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        id:
          format: uuid4
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - id
      - email
      - role
      - created_at
      title: AdminUserData
      type: object
    AdminUserListResponse:
      description: The `{ data, meta }` envelope around one page of users.
      properties:
        data:
          items:
            $ref: '#/components/schemas/AdminUserData'
          title: Data
          type: array
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
      - data
      - meta
      title: AdminUserListResponse
      type: object
    AuthenticatedUserData:
      description: 'The signed-in user, carrying only what a client may see: the id, address, and role.'
      properties:
        email:
          title: Email
          type: string
        id:
          format: uuid4
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - id
      - email
      - role
      title: AuthenticatedUserData
      type: object
    AuthenticatedUserResponse:
      description: The `{ data }` envelope every successful auth route answers with.
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUserData'
      required:
      - data
      title: AuthenticatedUserResponse
      type: object
    BillingRedirectData:
      description: The hosted Stripe page the browser is sent to next.
      properties:
        url:
          title: Url
          type: string
      required:
      - url
      title: BillingRedirectData
      type: object
    BillingRedirectResponse:
      description: The `{ data }` envelope around a Checkout or portal URL.
      properties:
        data:
          $ref: '#/components/schemas/BillingRedirectData'
      required:
      - data
      title: BillingRedirectResponse
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      description: The body of a password change, which proves the caller knows the current password.
      properties:
        current_password:
          maxLength: 72
          title: Current Password
          type: string
        new_password:
          maxLength: 72
          minLength: 8
          title: New Password
          type: string
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    CheckoutCreate:
      additionalProperties: false
      description: 'The body of `POST /v1/billing/checkout`: the Stripe price to subscribe to.'
      properties:
        price_id:
          maxLength: 255
          pattern: ^price_[A-Za-z0-9]+$
          title: Price Id
          type: string
      required:
      - price_id
      title: CheckoutCreate
      type: object
    ErrorCode:
      description: Every error code this application answers with, namespaced DOMAIN_REASON.
      enum:
      - AUTH_ADMIN_REQUIRED
      - AUTH_INVALID_CREDENTIALS
      - AUTH_REQUIRED
      - AUTH_SESSION_EXPIRED
      - AUTH_EMAIL_ALREADY_REGISTERED
      - AUTH_RESET_TOKEN_INVALID
      - BILLING_NO_ACCOUNT
      - BILLING_NOT_CONFIGURED
      - BILLING_WEBHOOK_MISCONFIGURED
      - BILLING_WEBHOOK_INVALID_SIGNATURE
      - BILLING_WEBHOOK_PROCESSING_FAILED
      - CSRF_HEADER_MISSING
      - IDEMPOTENCY_KEY_IN_PROGRESS
      - IDEMPOTENCY_KEY_REUSED
      - INPUT_PAYLOAD_TOO_LARGE
      - INPUT_VALIDATION_ERROR
      - RATE_LIMIT_EXCEEDED
      - ROUTING_METHOD_NOT_ALLOWED
      - ROUTING_NOT_FOUND
      - SERVER_DATABASE_UNAVAILABLE
      - SERVER_INTERNAL_ERROR
      - SERVER_RATE_LIMIT_UNAVAILABLE
      - SERVER_REQUEST_TIMEOUT
      - UPLOADS_STORAGE_UNCONFIGURED
      title: ErrorCode
      type: string
    ErrorResponse:
      description: 'One failed request: a registry code the client switches on and a human-readable message.


        `field_errors` is populated only for `INPUT_VALIDATION_ERROR` and omitted from the body

        entirely otherwise, so every other failure keeps the two-key shape clients already handle. It

        exists because a form has to show a message beside the input it belongs to, and the prose

        `error` string is documented as never parsed; reading the field out of it would make a

        human-readable sentence into an interface.'
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Machine-readable code from the error registry.
        error:
          description: Human-readable message; never parsed by clients.
          title: Error
          type: string
        field_errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          description: Per-field validation failures, present only for a 400.
          title: Field Errors
      required:
      - code
      - error
      title: ErrorResponse
      type: object
    FieldError:
      description: One field of a request body that failed validation, and why.
      properties:
        field:
          description: The offending field, as a dotted path without the body prefix.
          title: Field
          type: string
        message:
          description: Why this field was rejected.
          title: Message
          type: string
      required:
      - field
      - message
      title: FieldError
      type: object
    ForgotPasswordData:
      description: The confirmation a reset request answers with, identical for every address.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: ForgotPasswordData
      type: object
    ForgotPasswordRequest:
      additionalProperties: false
      description: 'The body of a reset request.


        The email carries no pattern, for the reason `LoginRequest` gives: the answer is the same 200

        for every address, and a 400 for one that is not even registrable would be the one response

        that differed.'
      properties:
        email:
          maxLength: 320
          minLength: 1
          title: Email
          type: string
      required:
      - email
      title: ForgotPasswordRequest
      type: object
    ForgotPasswordResponse:
      description: The `{ data }` envelope of a reset request.
      properties:
        data:
          $ref: '#/components/schemas/ForgotPasswordData'
      required:
      - data
      title: ForgotPasswordResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthLiveness:
      description: 'Body of `GET /health`: the process is up.'
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      title: HealthLiveness
      type: object
    HealthReadiness:
      description: 'Body of `GET /health/ready`: whether Postgres answered within the deadline.'
      properties:
        db:
          enum:
          - connected
          - disconnected
          title: Db
          type: string
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
      required:
      - status
      - db
      title: HealthReadiness
      type: object
    LoginRequest:
      additionalProperties: false
      description: 'The body of a sign-in.


        The email carries no pattern. A malformed address is a failed sign-in rather than a malformed

        request, and answering 400 here would tell a caller that an address is not even registrable,

        which is one more bit than a sign-in should reveal.'
      properties:
        email:
          maxLength: 320
          title: Email
          type: string
        password:
          maxLength: 72
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginRequest
      type: object
    PageMeta:
      description: 'Where a page sits in the whole list: the total, and the bounds that produced this
        page.'
      properties:
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - total
      - limit
      - offset
      title: PageMeta
      type: object
    PresignUploadRequest:
      additionalProperties: false
      description: 'What the client wants to upload: its purpose and its file extension.'
      properties:
        extension:
          maxLength: 5
          minLength: 1
          title: Extension
          type: string
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
      required:
      - purpose
      - extension
      title: PresignUploadRequest
      type: object
    PresignedUploadData:
      description: Everything the browser needs to PUT the file straight to R2.
      properties:
        content_type:
          title: Content Type
          type: string
        expires_in_seconds:
          title: Expires In Seconds
          type: integer
        key:
          title: Key
          type: string
        method:
          const: PUT
          default: PUT
          title: Method
          type: string
        upload_url:
          title: Upload Url
          type: string
      required:
      - upload_url
      - key
      - content_type
      - expires_in_seconds
      title: PresignedUploadData
      type: object
    PresignedUploadResponse:
      description: The success envelope for a presigned upload.
      properties:
        data:
          $ref: '#/components/schemas/PresignedUploadData'
      required:
      - data
      title: PresignedUploadResponse
      type: object
    RegisterRequest:
      additionalProperties: false
      description: The body of a registration.
      properties:
        email:
          maxLength: 320
          pattern: ^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$
          title: Email
          type: string
        password:
          maxLength: 72
          minLength: 8
          title: Password
          type: string
      required:
      - email
      - password
      title: RegisterRequest
      type: object
    ResetPasswordRequest:
      additionalProperties: false
      description: 'The body of a reset: the token from the email''s link and the new password.


        The password takes registration''s constraints, since it becomes the account''s password on

        exactly the same terms. The token''s ceiling is generous against the 43 characters a real one

        has, and exists so an oversized value is refused before it is hashed.'
      properties:
        password:
          maxLength: 72
          minLength: 8
          title: Password
          type: string
        token:
          maxLength: 256
          minLength: 1
          title: Token
          type: string
      required:
      - token
      - password
      title: ResetPasswordRequest
      type: object
    UploadPurpose:
      description: What the uploaded file is for; each purpose has its own extension allowlist.
      enum:
      - avatar
      title: UploadPurpose
      type: string
    UserRole:
      description: Every role the `user_role` enum holds, in its declared order.
      enum:
      - member
      - admin
      title: UserRole
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WebhookReceivedData:
      description: 'The acknowledgement Stripe needs: any 2xx stops its retries.'
      properties:
        received:
          title: Received
          type: boolean
      required:
      - received
      title: WebhookReceivedData
      type: object
    WebhookReceivedResponse:
      description: The `{ data }` envelope around the webhook's acknowledgement.
      properties:
        data:
          $ref: '#/components/schemas/WebhookReceivedData'
      required:
      - data
      title: WebhookReceivedResponse
      type: object
info:
  title: template-fastapi-nuxt
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Answer 200 without touching any dependency.
      operationId: read_liveness_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveness'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Read Liveness
      tags:
      - health
  /health/ready:
    get:
      description: Answer 200 when Postgres answers within the deadline, and 503 otherwise.
      operationId: read_readiness_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'
          description: Postgres did not answer within the deadline
      summary: Read Readiness
      tags:
      - health
  /v1/admin/users:
    get:
      description: Answer one page of users, oldest first, with the total and the bounds applied.
      operationId: read_users_v1_admin_users_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 1000000
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Read Users
      tags:
      - admin
  /v1/auth/forgot-password:
    post:
      description: 'Enqueue the reset email and answer 200, whether or not an account uses the address.


        The route never looks the address up. The job does, in the worker, so the response and the

        work this request causes are identical for a known and an unknown address (B-14).'
      operationId: request_password_reset_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Request Password Reset
      tags:
      - auth
  /v1/auth/login:
    post:
      description: Open a session for an existing account and set the session cookie.
      operationId: login_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Login
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: 'End the session if there is one, and clear the cookie either way.


        No injected `Response` is declared. FastAPI assigns a returned `Response` instance directly

        and never merges the injected one''s headers, so anything written to it here would be dropped

        without a test noticing, on the one route whose whole job is to get a cookie header right.'
      operationId: logout_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Logout
      tags:
      - auth
  /v1/auth/me:
    get:
      description: Answer the signed-in user's identity and role, and 401 without a usable session.
      operationId: read_me_v1_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Read Me
      tags:
      - auth
    patch:
      description: Replace the password after proving the current one, signing out every other session.
      operationId: change_my_password_v1_auth_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Change My Password
      tags:
      - auth
  /v1/auth/register:
    post:
      description: Create an account, sign it in, and set the session cookie.
      operationId: register_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Register
      tags:
      - auth
  /v1/auth/reset-password:
    post:
      description: Set a new password from an emailed token and sign the account out everywhere.
      operationId: reset_password_with_token_v1_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Reset Password With Token
      tags:
      - auth
  /v1/billing/checkout:
    post:
      description: Create a subscription Checkout session for the signed-in user; answer its URL.
      operationId: create_checkout_v1_billing_checkout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirectResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Create Checkout
      tags:
      - billing
  /v1/billing/portal:
    post:
      description: Open the billing portal for the signed-in user's Stripe customer; answer its URL.
      operationId: create_portal_v1_billing_portal_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirectResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Create Portal
      tags:
      - billing
  /v1/billing/webhook:
    post:
      description: 'Verify a Stripe delivery against its raw bytes and apply it at most once.


        The body is read as bytes and never parsed before the signature is checked, because any

        re-serialization would change the bytes Stripe signed. No session and no CSRF header are

        involved: Stripe sends neither, and the signature is what authenticates the request.'
      operationId: receive_webhook_v1_billing_webhook_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReceivedResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The event could not be processed
      summary: Receive Webhook
      tags:
      - billing
  /v1/uploads:
    post:
      description: Answer a URL the browser can PUT the file to within fifteen minutes.
      operationId: create_presigned_upload_v1_uploads_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An unexpected error occurred
      summary: Create Presigned Upload
      tags:
      - uploads
