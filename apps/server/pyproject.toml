[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend and arq worker for template-fastapi-nuxt."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "arq>=0.26",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.2",
    "boto3>=1.43.101",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "posthog>=7.60.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=5.3",
    "sentry-sdk>=2.70.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "stripe>=15.6.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D", "ANN", "PL"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# ANN0 and ANN2 (missing annotations) stay off in tests because mypy --strict already requires
# every annotation there; ANN401 stays on, so a test can never annotate a bare Any (IAN-384).
"tests/**" = ["S101", "D", "ANN0", "ANN2", "PLR2004"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
# The tests are held to the same strict typing as the app (IAN-380). Several test directories
# carry their own conftest.py without an __init__.py, so module names are taken from the path
# relative to apps/server rather than from the file name alone.
files = ["app", "tests"]
explicit_package_bases = true

# asyncpg ships no py.typed marker and has no stub package. The exception classes are imported
# only to recognize a lost connection, so the missing types cost nothing here.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# boto3 and botocore ship no type information; the stubs are a separate package, and the one
# method R2 presigning calls is typed by the `S3Presigner` protocol in app/clients/r2.py instead.
[[tool.mypy.overrides]]
module = ["boto3.*", "boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real Postgres reachable through TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["app"]
# The unit and integration suites run as separate CI jobs on separate runners, and a third job
# combines their data before the floor is checked. `relative_files` is what makes that possible:
# without it each runner records its own absolute working directory and the two sets of data
# refer to files that never match. Keeping the suites' data apart is done with `COVERAGE_FILE`
# per job, not with `parallel`, which pytest-cov does not need here.
relative_files = true

[tool.coverage.report]
# Checked once, against the combined data. The per-suite runs pass --cov-fail-under=0, because a
# suite that covers its own half of the code is not a failure.
fail_under = 80
