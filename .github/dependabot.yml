# dependabot.yml: weekly update PRs for the workflow actions and the package
# ecosystem, grouped so one PR carries the week's minor and patch bumps.
# Written by the repo-setup skill; edit freely once it exists.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
