# Git hooks (spec: lefthook), installed by `pnpm install` through the root prepare script.
# pre-commit checks the staged files; commit-msg enforces the fix-needs-a-test rule; pre-push runs
# the affected tests and the builds. The full suites run in CI (R-408, R-509).
pre-commit:
  # Sequential, because the fixers rewrite files: ruff and black, and Prettier and ESLint, touch
  # the same files, and running them in parallel lets one overwrite the other's fix.
  piped: true
  commands:
    prettier:
      glob: '*.{ts,mts,vue,js,mjs,json,md,yml,yaml,scss}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      root: apps/client/web/
      glob: '*.{ts,vue}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    # The root config covers what the web package's own config cannot reach: e2e/, packages/,
    # and the root configuration files. apps/ is excluded so a web file is linted once, by the
    # command above, under the Nuxt-generated rules rather than the root's.
    eslint-root:
      glob: '*.{ts,mts,mjs}'
      exclude:
        - 'apps/**/*'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    vue-tsc:
      glob: 'apps/client/web/**/*.{ts,vue}'
      run: pnpm --filter @repo/web typecheck
    ruff:
      root: apps/server/
      glob: '*.py'
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    black:
      root: apps/server/
      glob: '*.py'
      run: uv run black {staged_files}
      stage_fixed: true
    mypy:
      glob: 'apps/server/app/**/*.py'
      run: cd apps/server && uv run mypy app
    no-em-dash:
      glob: '*.{py,ts,mts,vue,js,mjs,md,scss,yml,yaml}'
      run: |
        em_dash=$(printf '\xe2\x80\x94')
        if grep -n "$em_dash" {staged_files}; then
          echo 'Em dash (U+2014) found in staged files (R-207). Use a period, comma, colon, or parentheses.'
          exit 1
        fi
    migration-defaults:
      glob: 'apps/server/migrations/**/*.py'
      run: |
        if grep -nE "server_default=[\"']['\"]" {staged_files}; then
          echo 'Nested quotes in a server_default (R-328): write server_default="draft" or sa.text("now()").'
          exit 1
        fi

commit-msg:
  commands:
    fix-requires-test:
      run: |
        subject=$(head -1 {1})
        if echo "$subject" | grep -qE '^(fix|bug|bugfix|hotfix)(\(.+\))?!?:'; then
          if ! git diff --cached --name-only | grep -qE '(\.(test|spec)\.(ts|mts|js)|/test_[^/]*\.py|\.test\.sh)$'; then
            echo 'A fix:/bug:/bugfix:/hotfix: commit must stage at least one test file (R-403).'
            exit 1
          fi
        fi

pre-push:
  piped: true
  commands:
    affected-tests:
      run: scripts/run-affected-tests.sh
    contract:
      run: scripts/check-contract-drift.sh
    build:
      run: pnpm build
